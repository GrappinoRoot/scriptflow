# Publishes to PyPI when a GitHub release is published, with PyPI trusted publishing
# (no token stored in the repository). Configure it once on pypi.org:
# project → Publishing → add GitHub publisher (this repo, workflow "publish.yml", environment "pypi").
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
