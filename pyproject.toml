[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scriptflow-procedural-memory"
version = "0.3.0"
description = "Procedural memory for LLM agents: record solved tasks, compile them into replayable skills, run them without reasoning again"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Carmellino", email = "tonycarmellino@gmail.com" }]
keywords = ["llm", "agent", "procedural-memory", "skills", "tool-calling", "agent-memory", "caching", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
procedural-memory = "procedural_memory.cli:main"

[project.urls]
Homepage = "https://github.com/GrappinoRoot/script-tool"
Issues = "https://github.com/GrappinoRoot/script-tool/issues"
Changelog = "https://github.com/GrappinoRoot/script-tool/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/procedural_memory"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "SPEC.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job; the prompt text stays verbatim
